# --- CONEXIÓN A SUPABASE (Connection Pooler) ---
# Proyecto activo: bnaqxitmvgmspufbkpvt (el original; se probó migrar a lweouztfnjubsgdztgrz pero
# se volvió atrás - ese proyecto nuevo quedó sin usar). La contraseña real va en
# application-local.properties (gitignored) o en la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.bnaqxitmvgmspufbkpvt}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE / JPA ---
# default_schema=auth es el esquema de Supabase Auth (tabla users). Las entidades propias del
# dominio (Contenido, etc.) declaran su propio @Table(schema = "public") y no dependen de este valor.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=auth

# --- FLYWAY (migraciones versionadas del esquema public: pgvector, tabla contenido, indices) ---
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true

# --- HIKARI CONNECTION POOL ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SupabaseHikariCP

# --- SUPABASE AUTH ---
supabase.url=${SUPABASE_URL:https://bnaqxitmvgmspufbkpvt.supabase.co}
supabase.api-key=${SUPABASE_API_KEY:your-anon-key}
supabase.service.role.key=${SUPABASE_SERVICE_KEY:your-service-role-key}
supabase.jwks-url=${SUPABASE_JWKS_URL:https://bnaqxitmvgmspufbkpvt.supabase.co/auth/v1/.well-known/jwks.json}

fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
fastapi.connection-timeout=5000
fastapi.read-timeout=5000

# --- OPENAI (embeddings para RAG + chat del Consultor IA) ---
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding-dimensions=1536
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.timeout.connect=5000
openai.timeout.response=20000

# --- RAG / DETECCION DE CASI-DUPLICADOS ---
rag.related-content.top-k=5
rag.related-content.min-similarity=0.75
rag.duplicate.warning-threshold=0.90

# --- APP (usado para el redirect_to del correo de confirmación de Supabase) ---
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- VAADIN ---
server.port=${PORT:8080}
logging.level.org.atmosphere=warn
vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.application