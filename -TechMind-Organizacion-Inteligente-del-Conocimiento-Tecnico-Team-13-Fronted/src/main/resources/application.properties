# --- CONEXIÓN A SUPABASE (Session Pooler, puerto 5432) ---
# Proyecto: bnaqxitmvgmspufbkpvt. maximum-pool-size subió de 2 a 5: con solo 2, cada vista que
# abre 1-2 queries casi simultáneas (Dashboard/Library +, desde que existe chat_mensaje, el
# Consultor IA cargando su última sesión) ya alcanzaba a saturar el pool y el resto de requests
# esperaban el connection-timeout completo -> "HikariPool-1 - Connection is not available,
# request timed out". minimum-idle=1 mantiene una conexión "tibia" lista en vez de pagar el
# costo de abrir una nueva contra el pooler (más lento por ser remoto) en cada pico de uso.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.bnaqxitmvgmspufbkpvt}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.initialization-fail-timeout=0

# --- HIBERNATE / JPA ---
# default_schema=auth es el esquema de Supabase Auth (tabla users). Las entidades propias del
# dominio (Contenido, etc.) declaran su propio @Table(schema = "public") y no dependen de este valor.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=auth

# --- FLYWAY (migraciones versionadas del esquema public: pgvector, tabla contenido, indices) ---
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true

# --- SUPABASE AUTH ---
supabase.url=${SUPABASE_URL:https://bnaqxitmvgmspufbkpvt.supabase.co}
supabase.api-key=${SUPABASE_API_KEY:your-anon-key}
supabase.service.role.key=${SUPABASE_SERVICE_KEY:your-service-role-key}
supabase.jwks-url=${SUPABASE_JWKS_URL:https://bnaqxitmvgmspufbkpvt.supabase.co/auth/v1/.well-known/jwks.json}

# --- CLASIFICADOR (Flask, servicio de Data Science) ---
classifier.base-url=${CLASSIFIER_BASE_URL:http://localhost:5000}
classifier.timeout.connect=5000
classifier.timeout.response=10000

# --- OPENAI (embeddings para RAG + chat del Consultor IA) ---
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding-dimensions=1536
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.timeout.connect=5000
openai.timeout.response=20000

# --- RAG / DETECCION DE CASI-DUPLICADOS ---
# min-similarity a 0.75 era demasiado estricto para embeddings reales de text-embedding-3-small:
# en la práctica, la similitud coseno entre una pregunta y un documento relacionado (pero con
# palabras distintas) suele caer entre 0.2 y 0.6, rara vez supera 0.7 salvo casi-duplicados
# textuales. Con 0.75 el chat RAG descartaba coincidencias legítimas antes de que el modelo las
# viera, aunque hubiera contenido guardado. duplicate.warning-threshold se queda alto a propósito:
# ahí SÍ se busca casi-duplicado textual, no relación temática.
rag.related-content.top-k=5
rag.related-content.min-similarity=0.3
rag.duplicate.warning-threshold=0.90

# --- APP (usado para el redirect_to del correo de confirmación de Supabase) ---
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- VAADIN / SERVIDOR ---
server.port=${PORT:8085}
logging.level.org.atmosphere=warn
vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.application

# Aumenta el límite de memoria en búfer global para codecs de Spring (uploads/respuestas grandes)
spring.codec.max-in-memory-size=20MB

# --- LOGGING ---
# Además de la consola de IntelliJ, todo queda en logs/application.log (rotado por tamaño/fecha
# con los defaults de Spring Boot) para poder revisar o compartir el historial completo sin
# depender del scrollback de la consola.
logging.file.name=logs/application.log
logging.level.com.application=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%logger{36}] %msg%n
