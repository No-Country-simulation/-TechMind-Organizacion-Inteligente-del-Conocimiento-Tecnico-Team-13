# --- CONEXIÓN A SUPABASE (Connection Pooler) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.bnaqxitmvgmspufbkpvt}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE / JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=auth

# --- HIKARI CONNECTION POOL ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SupabaseHikariCP

# --- SUPABASE AUTH ---
supabase.url=${SUPABASE_URL:https://bnaqxitmvgmspufbkpvt.supabase.co}
supabase.api-key=${SUPABASE_API_KEY:your-anon-key}
supabase.service.role.key=${SUPABASE_SERVICE_KEY:your-service-role-key}

fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
fastapi.connection-timeout=5000
fastapi.read-timeout=5000

# --- VAADIN ---
server.port=${PORT:8080}
logging.level.org.atmosphere=warn
vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.application